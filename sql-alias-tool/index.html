<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SQL Alias Converter Ver 2</title>
</head>
<body>
  <h2>SQL @변수 → Alias 변환기 (Ver 2)</h2>
  <textarea id="input" rows="10" cols="80" placeholder="쿼리를 붙여넣으세요"></textarea><br>
  <button onclick="convert()">변환하기</button>
  <div id="variables" style="margin-top: 20px;"></div>
  <button onclick="replaceVariables()">값 대입하기</button>
  <pre id="output"></pre>

  <script>
    let variables = {};

    function convert() {
      let sql = document.getElementById("input").value;

      // @변수 = 컬럼 → 컬럼 AS 변수
      let result = sql.replace(/@(\w+)\s*=\s*([^\s,]+)/g, "$2 AS $1");

      // WHERE 절에서 @변수 추출
      let whereMatches = sql.match(/@(\w+)/g);
      if (whereMatches) {
        variables = [...new Set(whereMatches)]; // 중복 제거
        displayVariableInputs();
      }

      document.getElementById("output").textContent = result;
    }

    function displayVariableInputs() {
      const container = document.getElementById("variables");
      container.innerHTML = "<h3>WHERE 절 변수 값 입력</h3>";

      variables.forEach(variable => {
        const label = document.createElement("label");
        label.textContent = `${variable}: `;
        const input = document.createElement("input");
        input.type = "text";
        input.id = `var-${variable}`;
        input.placeholder = `${variable} 값 입력`;
        container.appendChild(label);
        container.appendChild(input);
        container.appendChild(document.createElement("br"));
      });
    }

    function replaceVariables() {
      let sql = document.getElementById("output").textContent;

      variables.forEach(variable => {
        const value = document.getElementById(`var-${variable}`).value;
        if (value) {
          // @변수를 입력값으로 대체
          const regex = new RegExp(variable, "g");
          sql = sql.replace(regex, `'${value}'`);
        }
      });

      document.getElementById("output").textContent = sql;
    }
  </script>
</body>
</html>
